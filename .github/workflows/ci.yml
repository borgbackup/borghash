# badge: https://github.com/borgbackup/borghash/workflows/CI/badge.svg?branch=main

name: CI

on:
  push:
    branches: [ main ]
    paths:
    - '**.py'
    - '**.pyx'
    - '**.cpp'
    - '**.yml'
    - '**.toml'
    - '**.ini'
    - 'requirements.d/*'
  pull_request:
    branches: [ main ]
    paths:
    - '**.py'
    - '**.pyx'
    - '**.cpp'
    - '**.yml'
    - '**.toml'
    - '**.ini'
    - 'requirements.d/*'

jobs:
  linux:

    strategy:
      fail-fast: true
      matrix:
        include:
            - os: ubuntu-24.04
              python-version: '3.11'
              toxenv: py311
            - os: ubuntu-24.04
              python-version: '3.14'
              toxenv: py314
            - os: ubuntu-latest
              python-version: '3.15-dev'
              toxenv: py315
              # 3.15 is not released yet, so do not fail the whole matrix if it
              # (or Cython not supporting it yet) breaks.
              allow-failure: true

    env:
      TOXENV: ${{ matrix.toxenv }}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure || false }}

    steps:
    - uses: actions/checkout@v4
      with:
        # just fetching 1 commit is not enough for setuptools-scm, so we fetch all
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -r requirements.d/dev.txt
    - name: Install borghash
      run: |
        python setup.py build_ext --inplace
        python -m build
        pip install -v dist/borghash*.tar.gz
    - name: run tox env
      run: tox --skip-missing-interpreters
